<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stacked Cards Scroll Animation</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Framer Motion -->
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
  
  <!-- Babel to process JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-zinc-950 text-white font-sans antialiased">

  <div id="root"></div>

  <script type="text/babel">
    const { useRef } = React;
    const { motion, useScroll, useTransform } = Motion;

    const cards = [
      {
        id: 1,
        title: "Card One",
        subtitle: "Initial layer in the stack",
        bg: "bg-zinc-900 border-red-900/40",
        img: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=1200&auto=format&fit=crop"
      },
      {
        id: 2,
        title: "Card Two",
        subtitle: "Stacks directly over the first",
        bg: "bg-zinc-900 border-purple-900/40",
        img: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=1200&auto=format&fit=crop"
      },
      {
        id: 3,
        title: "Card Three",
        subtitle: "Third section taking focus",
        bg: "bg-zinc-900 border-blue-900/40",
        img: "https://images.unsplash.com/photo-1517841905240-472988babdf9?q=80&w=1200&auto=format&fit=crop"
      },
      {
        id: 4,
        title: "Card Four",
        subtitle: "Final top card completes the stack",
        bg: "bg-zinc-900 border-emerald-900/40",
        img: "https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?q=80&w=1200&auto=format&fit=crop"
      }
    ];

    function StackedCard({ card, index, totalCards }) {
      const containerRef = useRef(null);

      const { scrollYProgress } = useScroll({
        target: containerRef,
        offset: ["start end", "start start"]
      });

      // Subtle scale-down effect for lower cards as upper cards cover them
      const scale = useTransform(scrollYProgress, [0, 1], [0.95, 1]);

      return (
        <div 
          ref={containerRef} 
          className="h-screen sticky top-0 flex items-center justify-center p-4"
        >
          <motion.div
            style={{ 
              scale,
              // Offsets top sticky positioning slightly so card headers remain visible
              top: `calc(10% + ${index * 25}px)` 
            }}
            className={`relative w-full max-w-2xl h-[65vh] rounded-[2.5rem] border overflow-hidden shadow-2xl ${card.bg} p-6 flex flex-col justify-between`}
          >
            {/* Background Image with Dark Vignette */}
            <img 
              src={card.img} 
              alt={card.title} 
              className="absolute inset-0 w-full h-full object-cover brightness-50 -z-10"
            />

            {/* Card Content Header */}
            <div className="flex justify-between items-center z-10">
              <span className="text-xs font-mono uppercase tracking-widest text-zinc-400 bg-black/40 px-3 py-1 rounded-full backdrop-blur-md">
                0{card.id} / 0{totalCards}
              </span>
              <span className="text-xs font-mono text-zinc-400">Scroll Stack</span>
            </div>

            {/* Card Content Footer */}
            <div className="z-10 bg-gradient-to-t from-black/80 via-black/40 to-transparent p-4 rounded-2xl backdrop-blur-sm">
              <h2 className="text-3xl font-bold">{card.title}</h2>
              <p className="text-zinc-300 text-sm mt-1">{card.subtitle}</p>
            </div>
          </motion.div>
        </div>
      );
    }

    function App() {
      return (
        <div className="w-full">
          {/* Hero Header */}
          <div className="h-[60vh] flex flex-col items-center justify-center text-center px-4">
            <h1 className="text-4xl font-bold tracking-tight mb-2">Card Stacking Scroll</h1>
            <p className="text-zinc-400 max-w-sm">Scroll down to watch cards stack smoothly on top of one another.</p>
          </div>

          {/* Stacked Cards Container */}
          <div className="relative pb-[20vh]">
            {cards.map((card, index) => (
              <StackedCard 
                key={card.id} 
                card={card} 
                index={index} 
                totalCards={cards.length} 
              />
            ))}
          </div>

          {/* Footer Section */}
          <div className="h-[50vh] flex items-center justify-center text-zinc-600 font-mono text-sm">
            End of stacked card gallery
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
